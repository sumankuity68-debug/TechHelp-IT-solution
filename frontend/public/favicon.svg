<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- High-contrast bright blue gradient for T/shield-left -->
    <linearGradient id="blue_grad" x1="20" y1="20" x2="120" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    
    <!-- Luminous teal/cyan gradient for H/shield-right -->
    <linearGradient id="teal_grad" x1="180" y1="40" x2="60" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3CE4D8" />
      <stop offset="50%" stop-color="#0ABDB7" />
      <stop offset="100%" stop-color="#006A7A" />
    </linearGradient>

    <!-- Shadow filter for extra pop -->
    <filter id="subtle_shadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <g filter="url(#subtle_shadow)">
    <!-- Left Blue Element (The 'T' / Shield Left) -->
    <path d="M 103,42 L 58,56 C 50,86 54,124 103,158 C 95,145 89,125 89,106 C 89,86 97,71 103,64 L 103,42 Z" fill="url(#blue_grad)" />
    
    <!-- Top bar left extension of the T -->
    <path d="M 103,42 L 78,49 C 78,49 82,59 86,60 L 103,55 Z" fill="url(#blue_grad)" />

    <!-- Right Teal Element (The 'H' / Shield Right & Arrow) -->
    <path d="M 103,158 C 152,124 156,86 148,56 L 140,46 L 160,42 L 165,63 L 155,53 L 142,69 C 146,89 142,110 128,124 C 116,136 103,147 103,158 Z" fill="url(#teal_grad)" />

    <!-- Weaving crossbar of H -->
    <path d="M 89,106 C 101,106 113,100 123,90 C 127,86 130,82 133,78 C 125,78 117,84 109,90 C 99,100 89,106 89,106 Z" fill="url(#teal_grad)" />

    <!-- Network Circuit Line & Node 1 (Blue Part) -->
    <path d="M 93,57 L 108,77" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" />
    <circle cx="108" cy="77" r="3.5" fill="#3B82F6" />

    <!-- Network Circuit Line & Node 2 (Teal Part) -->
    <path d="M 119,110 L 109,90" stroke="#0ABDB7" stroke-width="2" stroke-linecap="round" />
    <circle cx="109" cy="90" r="3.5" fill="#3CE4D8" />
  </g>
</svg>
